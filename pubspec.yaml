name: native_sushi_app
description: A Flutter app that mirrors the functionality of the Watta‑Sushi website using the existing backend.
publish_to: "none"

version: 0.1.0

environment:
  sdk: "^3.1.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.0.15
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.5
  slang: ^4.0.0
  slang_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  slang_build_runner: ^4.0.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/